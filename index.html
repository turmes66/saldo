<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сальдо — личный кабинет учёта ДС</title>
  <link rel="icon" type="image/png" href="assets/saldo-icon.png?v=5" />
  <link rel="apple-touch-icon" href="assets/saldo-icon.png?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260814u" />
</head>
<body>
  <!-- LOGIN -->
  <div id="screen-login" class="login-screen">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-mark" aria-hidden="true">
          <img class="logo-img" src="assets/saldo-icon.png?v=5" alt="" width="52" height="52" />
        </div>
        <div>
          <h1 class="brand-name">Сальдо</h1>
          <p class="brand-tag">Учёт денежных средств</p>
        </div>
      </div>
      <p class="login-lead">Войдите с учётными данными, выданными администратором.</p>
      <form id="login-form" class="login-form">
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="login-email" value="admin@example.com" required autocomplete="username" />
        </label>
        <label class="field">
          <span>Пароль</span>
          <input type="password" id="login-password" value="demo" required autocomplete="current-password" />
        </label>
        <p class="login-hint">Самостоятельная регистрация и восстановление пароля недоступны. При утере пароля обратитесь к администратору.</p>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
      </form>
      <div class="demo-switch">
        <span>Демо-вход:</span>
        <button type="button" class="chip" data-demo="admin">Администратор</button>
        <button type="button" class="chip" data-demo="user">Пользователь</button>
      </div>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="screen-app" class="app hidden" aria-hidden="true">
    <aside class="sidebar">
      <button type="button" class="sidebar-brand" id="brand-home" title="На главную" aria-label="На главную">
        <div class="logo-mark sm" aria-hidden="true">
          <img class="logo-img" src="assets/saldo-icon.png?v=5" alt="" width="42" height="42" />
        </div>
        <div>
          <div class="brand-name">Сальдо</div>
          <div class="brand-tag">Учёт ДС</div>
        </div>
      </button>

      <nav class="nav" id="nav-main"></nav>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <h2 class="page-title" id="page-title">Главная</h2>
        </div>
        <div class="topbar-user" id="topbar-user" title="Учётная запись">
          <div class="avatar" id="user-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" fill="currentColor"/><path d="M5 19.5c1.5-3.5 4-5 7-5s5.5 1.5 7 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
          <div class="user-meta">
            <div class="user-name" id="user-name">—</div>
            <div class="user-role" id="user-role">—</div>
          </div>
          <button type="button" class="btn-ghost" id="btn-logout" title="Выйти">Выйти</button>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="app.js?v=20260814u"></script>
</body>
</html>
